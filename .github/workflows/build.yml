name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check entry syntax
        run: npm run build
      - name: Check the excuse and its output
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";

          const text = readFileSync("text.txt", "utf8");
          assert.match(text, /^[^\r\n]+\n$/, "Expected exactly one line and a final newline.");
          const excuse = text.slice(0, -1);
          const length = Array.from(excuse).length;
          assert.ok(length <= 200, "The excuse exceeds 200 characters.");
          const output = execFileSync(process.execPath, ["main.ts"], { encoding: "utf8" });
          assert.equal(output, text, "The entrypoint must print text.txt exactly.");
          const readme = readFileSync("README.md", "utf8");
          assert.ok(readme.includes(excuse), "The README must contain the excuse.");
          assert.equal((readme.match(/!\[/g) ?? []).length, 3, "Expected three badges.");
          console.log(`Entry checks passed: ${length}/200 characters.`);
          NODE
